
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéShop | Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <h1>POKÉSHOP</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="checkout.html">Cart</a>
        </nav>
    </header>

    <!-- Checkout section -->
    <main class="checkout">
        <h2>Your Shopping Cart</h2>
        <p>Review your selected Pokémon below.</p>

        <!-- Cart items appear here -->
        <div id="cart-items"></div>

        <!-- Cart summary -->
        <div id="cart-summary">
            <h3>Total: $<span id="total-price">0.00</span></h3>

            <!-- Bonus: Clear cart -->
            <button id="clear-cart" class="clear-btn">
                Clear Cart
            </button>
        </div>

        <a href="index.html" class="continue-btn">
            Continue Shopping
        </a>
    </main>

    <footer>
        <p>PokéShop | W11B JavaScript Project</p>
    </footer>

    <!-- JS Cookies Library -->
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>

    <!-- Checkout JavaScript -->
    <script src="checkout.js"></script>

</body>
</html>
